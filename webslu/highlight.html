<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AST Studio: Syntax Highlighter & Inspector</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            /* Theme - Dark */
            --bg-app: #1e1e1e;
            --bg-panel: #252526;
            --bg-header: #333333;
            --bg-gutter: #1e1e1e;
            --border-color: #3e3e42;
            --border-focus: #007fd4;

            /* Text */
            --text-main: #cccccc;
            --text-header: #ffffff;
            --text-muted: #858585;

            /* Status */
            --bg-status: #007acc;
            --bg-status-error: #f14c4c;
            --bg-status-success: #4caf50;

            /* Scrollbar */
            --scrollbar-bg: #1e1e1e;
            --scrollbar-thumb: #424242;
        }

        * {
            box-sizing: border-box;
            outline: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-app);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            height: 48px;
            background-color: var(--bg-header);
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
            justify-content: space-between;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: var(--text-header);
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .brand svg {
            width: 20px;
            height: 20px;
            fill: var(--text-main);
        }

        .actions button {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s;
        }

        .actions button:hover {
            background-color: #3e3e42;
        }

        .actions button:active {
            background-color: #4e4e52;
        }

        /* --- Main Workspace --- */
        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            /* Fix flex overflow */
        }

        .panel:first-child {
            border-right: 1px solid var(--border-color);
        }

        .panel-header {
            height: 28px;
            background-color: var(--bg-panel);
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            user-select: none;
            flex-shrink: 0;
        }

        /* --- Input Area --- */
        .editor-wrapper {
            flex: 1;
            display: flex;
            position: relative;
            background-color: var(--bg-app);
        }

        .gutter {
            width: 45px;
            background-color: var(--bg-gutter);
            color: #606060;
            text-align: right;
            padding: 10px 8px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.5;
            user-select: none;
            overflow: hidden;
            border-right: 1px solid var(--border-color);
            flex-shrink: 0;
            white-space: pre;
        }

        textarea#sourceInput {
            flex: 1;
            background-color: transparent;
            color: #d4d4d4;
            border: none;
            resize: none;
            padding: 10px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre;
            overflow: auto;
            tab-size: 4;
        }

        /* --- Output Area --- */
        .preview-wrapper {
            flex: 1;
            position: relative;
            background-color: var(--bg-app);
            overflow: auto;
        }

        #codeBlock {
            margin: 0;
            padding: 10px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre;
            color: #d4d4d4;
            min-height: 100%;
        }

        /* --- Interactive Tokens --- */
        .token {
            display: inline;
            cursor: default;
            border-radius: 2px;
            transition: background-color 0.1s;
        }

        .token:hover {
            background-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        /* --- Footer --- */
        footer {
            height: 22px;
            background-color: var(--bg-status);
            color: white;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 11px;
            justify-content: flex-end;
            transition: background-color 0.3s;
        }

        footer.error {
            background-color: var(--bg-status-error);
        }

        footer.success {
            background-color: var(--bg-status-success);
        }

        /* --- Tooltip --- */
        #ast-tooltip {
            position: absolute;
            background: #252526;
            border: 1px solid #454545;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 4px;
            max-width: 320px;
            z-index: 1000;
            display: none;
            font-size: 12px;
            pointer-events: none;
        }

        #ast-tooltip h4 {
            margin: 0 0 8px 0;
            color: #fff;
            font-size: 13px;
            border-bottom: 1px solid #454545;
            padding-bottom: 4px;
        }

        #ast-tooltip pre {
            margin: 0;
            background: #1e1e1e;
            padding: 6px;
            border-radius: 3px;
            overflow-x: auto;
            color: #9cdcfe;
            font-family: 'Fira Code', monospace;
            font-size: 11px;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scrollbar-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Mobile */
        @media (max-width: 768px) {
            main {
                flex-direction: column;
            }

            .panel {
                height: 50%;
            }

            .panel:first-child {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
        }
    </style>

    <!-- External Dependency: Parser and AST Definitions -->
    <script src="ast.js"></script>
</head>

<body>

    <header>
        <div class="brand">
            <svg viewBox="0 0 24 24">
                <path
                    d="M14.6,16.6L19.2,12L14.6,7.4L16,6L22,12L16,18L14.6,16.6M9.4,16.6L4.8,12L9.4,7.4L8,6L2,12L8,18L9.4,16.6Z" />
            </svg>
            AST Studio
        </div>
        <div class="actions">
            <button onclick="document.getElementById('sourceInput').value = ''; highlightCode();">Clear</button>
            <button onclick="highlightCode()">Force Parse</button>
        </div>
    </header>

    <main>
        <!-- Input Panel -->
        <div class="panel">
            <div class="panel-header">Source Code</div>
            <div class="editor-wrapper">
                <div id="lineNumbers" class="gutter">1</div>
                <textarea id="sourceInput" spellcheck="false" placeholder="Paste your code here..."></textarea>
            </div>
        </div>

        <!-- Output Panel -->
        <div class="panel">
            <div class="panel-header">Highlighted AST</div>
            <div class="preview-wrapper" id="previewContainer">
                <div id="codeBlock"></div>
            </div>
        </div>
    </main>

    <footer id="statusBar">Ready</footer>

    <!-- Tooltip Element -->
    <div id="ast-tooltip">
        <h4 id="tt-type">Type</h4>
        <pre id="tt-content">...</pre>
    </div>

    <script>
        /**
         * ========================================================================
         * COLOR CONFIGURATION
         * ========================================================================
         */
        const COLORS = {
            // Types
            GEN_OP: '#8E98A8', PUNCTUATION: '#A9B0BC', BRACES: '#BFC4CC',
            NAME: '#D8D8D8', NAME_TABLE: '#9CA5B2', NAME_TYPE: '#36A57E',
            NAME_LABEL: '#72CC82', NAME_LIFETIME: '#6a8c72', BUILITIN_VAR: '#6582C1',

            // Literals
            NUMBER: '#539BBD', NUMBER_KIND: '#6B73A1', STRING: '#7AA737', STRING_OUT: '#ACD163',

            // Control Flow
            COND_STAT: '#BD71C4', END_STAT: '#CE4C4C', FN_STAT: '#CE4C4C', VAR_STAT: '#D87D7D',
            ASSIGN: '#E5506F',

            // Comments / Misc
            COMMENT_WIP: '#CCFF00', WHITESPACE: '#575763', COMMENT_OUTER: '#3D3D44',
            COMMENT_DOC: '#378731', COMMENT_DOC_OUTER: '#196022',

            // Keywords / Annotations
            AS: '#D8B770', CON_STAT: '#D8B770', PAT_RESTRICT: '#BFC4CC', DROP_STAT: '#666CCC',
            EX_TINT: '#22275B', COMP_TINT: '#C6C611', ANNOTATION: '#A8A820',

            // Modifiers
            REF_CONST: '#8AB6CE', REF: '#8AB6CE', REF_SHARE: '#E4C4FF', REF_MUT: '#FF9647', MUT: '#FF9647',

            // Operators
            RANGE: '#498CFF', TRY: '#68997E', DYN: '#BF87FF', IMPL: '#CE905A', AND: '#5787DB', OR: '#B58055',
        };

        const KEYWORD_MAP = {
            'if': COLORS.COND_STAT, 'else': COLORS.COND_STAT, 'while': COLORS.COND_STAT,
            'for': COLORS.COND_STAT, 'loop': COLORS.COND_STAT, 'match': COLORS.COND_STAT,
            'return': COLORS.END_STAT, 'break': COLORS.END_STAT, 'continue': COLORS.END_STAT,
            'fn': COLORS.FN_STAT, 'struct': COLORS.CON_STAT, 'enum': COLORS.CON_STAT,
            'let': COLORS.VAR_STAT, 'const': COLORS.VAR_STAT, 'mut': COLORS.MUT,
            'unsafe': COLORS.FN_STAT, 'self': COLORS.BUILITIN_VAR, 'crate': COLORS.NAME,
            '@': COLORS.ANNOTATION, 'dyn': COLORS.DYN, 'as': COLORS.AS,
            '..': COLORS.RANGE, '=': COLORS.ASSIGN, '->': COLORS.PUNCTUATION, '=>': COLORS.ASSIGN,
            ':': COLORS.PUNCTUATION, '::': COLORS.PUNCTUATION, ';': COLORS.PUNCTUATION,
            ',': COLORS.PUNCTUATION, '.': COLORS.PUNCTUATION, '?': COLORS.TRY,
            '{': COLORS.BRACES, '}': COLORS.BRACES, '(': COLORS.BRACES, ')': COLORS.BRACES,
            '[': COLORS.BRACES, ']': COLORS.BRACES
        };

        /**
         * ========================================================================
         * HIGHLIGHTER VISITOR (Extends base Visitor from ast.js)
         * ========================================================================
         */
        class HighlighterVisitor extends Visitor {
            constructor() {
                super();
                this.fragment = document.createDocumentFragment();
            }

            // Helper to escape HTML
            escape(text) {
                if (!text) return "";
                return text.replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            // Core emit function: Creates a DOM node instead of a string
            // This allows us to attach the 'node' reference to the DOM element for inspection
            emit(color, text, astNode) {
                if (!text) return;

                const span = document.createElement('span');
                span.textContent = text;
                span.className = 'token';
                span.style.color = color;

                // Attach the raw AST node to the DOM element for the tooltip
                span.astNode = astNode;

                this.fragment.appendChild(span);
            }

            // --- Overrides ---

            visitToken(node) {
                if (node.preSpace) this.emit(COLORS.WHITESPACE, node.preSpace, node);
                if (node.txt) {
                    let color = COLORS.NAME;
                    if (KEYWORD_MAP.hasOwnProperty(node.txt)) color = KEYWORD_MAP[node.txt];
                    else if (/^[0-9]/.test(node.txt)) color = COLORS.NUMBER;
                    else if (/^["\[[]/.test(node.txt)) color = COLORS.STRING;
                    else if (/^[&*]/.test(node.txt)) color = COLORS.REF;

                    this.emit(color, this.escape(node.txt), node);
                }
                return node;
            }

            visitNum(node) {
                if (node.preSpace) this.emit(COLORS.WHITESPACE, node.preSpace, node);
                this.emit(COLORS.NUMBER, this.escape(node.num), node);
                return node;
            }

            visitStr(node) {
                if (node.preSpace) this.emit(COLORS.WHITESPACE, node.preSpace, node);
                this.emit(COLORS.STRING, this.escape(node.str), node);
                return node;
            }

            visitName(node) {
                if (node.preSpace) this.emit(COLORS.WHITESPACE, node.preSpace, node);
                this.emit(COLORS.NAME, this.escape(node.name), node);
                return node;
            }

            visitDocLineAnnotation(node) {
                if (node.preSpace) this.emit(COLORS.WHITESPACE, node.preSpace, node);
                this.emit(COLORS.COMMENT_DOC, this.escape(node.txt + node.content), node);
                return node;
            }

            visitOuterDocLineAnnotation(node) {
                if (node.preSpace) this.emit(COLORS.WHITESPACE, node.preSpace, node);
                this.emit(COLORS.COMMENT_DOC_OUTER, this.escape(node.txt + node.content), node);
                return node;
            }

            visitOptToken(node) {
                if (node.present && node.txt) {
                    if (node.preSpace) this.emit(COLORS.WHITESPACE, node.preSpace, node);
                    let color = COLORS.NAME;
                    if (KEYWORD_MAP.hasOwnProperty(node.txt)) color = KEYWORD_MAP[node.txt];
                    this.emit(color, this.escape(node.txt), node);
                }
                return node;
            }
        }

        /**
         * ========================================================================
         * APP LOGIC
         * ========================================================================
         */
        const inputArea = document.getElementById('sourceInput');
        const lineNumbers = document.getElementById('lineNumbers');
        const outputBlock = document.getElementById('codeBlock');
        const statusEl = document.getElementById('statusBar');
        const previewContainer = document.getElementById('previewContainer');

        // Tooltip Elements
        const tooltip = document.getElementById('ast-tooltip');
        const ttType = document.getElementById('tt-type');
        const ttContent = document.getElementById('tt-content');

        const DEMO_CODE = `
ex unsafe fn main(x=4) {
    -- Calculate fibonacci
--[[mul
]]
    let n = 10;
    let result = fib(n);
    
    if result > 100 {
        print("Big number",3);
let u8 p = @aaple{h=4} poo ~ 4 ** ~[]2;
return "atyyyy" ++ [[333]].*.:app | ! -0xFf00fp+44;
    } 
--wwwwewe
else {
        x = crate::print("Small number" as 444);
    }
    const x = 5??? try {3=>..}
    unsafe {
        -- Do something unsafe
        let *in g /apple ** ***mut ptr = &&&in g /apple const result;
    }
--4444
---Kk
for *in g /a mut AaaX{a,b,{|a|_,|b|*mut u8 a}} in ..6+4 {}
}`;

        inputArea.value = DEMO_CODE.trim();

        // --- Highlighting Function ---

        async function highlightCode() {
            const code = inputArea.value;

            // Clear Output
            outputBlock.innerHTML = '';
            statusEl.textContent = "Parsing...";
            statusEl.className = "";
            statusEl.style.backgroundColor = "var(--bg-status)";

            try {
                // 1. Parse
                // Assuming Parser is globally available from ast.js
                const parser = new Parser(code);
                const ast = parser.parseChunk();

                statusEl.textContent = "Parsed successfully";
                statusEl.className = "success";
                statusEl.style.backgroundColor = "var(--bg-status-success)";

                // 2. Traverse
                const visitor = new HighlighterVisitor();
                visitor.visit(ast);

                // 3. Render
                outputBlock.appendChild(visitor.fragment);

            } catch (e) {
                console.error(e);
                statusEl.textContent = "Error: " + e.message;
                statusEl.className = "error";
                statusEl.style.backgroundColor = "var(--bg-status-error)";
                const errSpan = document.createElement('span');
                errSpan.style.color = 'var(--bg-status-error)';
                errSpan.textContent = e.message;
                outputBlock.appendChild(errSpan);
            }
        }

        // --- Line Numbers Sync ---
        function updateLineNumbers() {
            const lines = inputArea.value.split('\n').length;
            lineNumbers.innerHTML = Array(lines).fill(0).map((_, i) => i + 1).join('\n');
        }

        function syncScroll() {
            lineNumbers.scrollTop = inputArea.scrollTop;
        }

        // --- Tooltip Interactions ---

        // Show tooltip on hover
        outputBlock.addEventListener('mouseover', (e) => {
            if (e.target.classList.contains('token')) {
                const node = e.target.astNode;
                if (node) {
                    // Format Node Data for display
                    // We try to show relevant properties
                    let details = {};
                    for (let key in node) {
                        if (node.hasOwnProperty(key) && key !== 'type' && key !== 'preSpace') {
                            const val = node[key];
                            // Avoid showing circular ref or huge objects
                            if (typeof val !== 'object' && typeof val !== 'function') {
                                details[key] = val;
                            }
                        }
                    }

                    ttType.textContent = node.type;
                    ttContent.textContent = JSON.stringify(details, null, 2);

                    tooltip.style.display = 'block';
                }
            }
        });

        // Move tooltip
        outputBlock.addEventListener('mousemove', (e) => {
            const x = e.clientX + 15;
            const y = e.clientY + 15;

            // Boundary checks
            if (x + 320 > window.innerWidth) {
                tooltip.style.left = (e.clientX - 325) + 'px';
            } else {
                tooltip.style.left = x + 'px';
            }
            tooltip.style.top = y + 'px';
        });

        // Hide tooltip
        outputBlock.addEventListener('mouseout', (e) => {
            if (e.target.classList.contains('token')) {
                tooltip.style.display = 'none';
            }
        });

        // --- Event Listeners ---

        inputArea.addEventListener('input', () => {
            updateLineNumbers();
            debounce(highlightCode, 500)();
        });

        inputArea.addEventListener('scroll', syncScroll);

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            updateLineNumbers();
            highlightCode();
        });

        // Utility: Debounce
        let debounceTimer;
        function debounce(func, wait) {
            return function () {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => func.apply(this, arguments), wait);
            };
        }

    </script>
</body>

</html>
