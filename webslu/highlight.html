<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AST Studio: Syntax Highlighter</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            /* Theme - Dark */
            --bg-app: #1e1e1e;
            --bg-panel: #252526;
            --bg-header: #333333;
            --bg-gutter: #1e1e1e;
            --border-color: #3e3e42;
            --border-focus: #007fd4;

            /* Text */
            --text-main: #cccccc;
            --text-header: #ffffff;
            --text-muted: #858585;

            /* Status */
            --bg-status: #007acc;
            --bg-status-error: #f14c4c;
            --bg-status-success: #4caf50;

            /* Scrollbar */
            --scrollbar-bg: #1e1e1e;
            --scrollbar-thumb: #424242;
        }

        * {
            box-sizing: border-box;
            outline: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-app);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            height: 48px;
            background-color: var(--bg-header);
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
            justify-content: space-between;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            color: var(--text-header);
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .brand svg {
            width: 20px;
            height: 20px;
            fill: var(--text-main);
        }

        .actions button {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            transition: background 0.2s;
        }

        .actions button:hover {
            background-color: #3e3e42;
        }

        .actions button:active {
            background-color: #4e4e52;
        }

        /* --- Main Workspace --- */
        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .panel:first-child {
            border-right: 1px solid var(--border-color);
        }

        .panel-header {
            height: 28px;
            background-color: var(--bg-panel);
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            user-select: none;
            flex-shrink: 0;
        }

        /* --- Input Area --- */
        .editor-wrapper {
            flex: 1;
            display: flex;
            position: relative;
            background-color: var(--bg-app);
        }

        .gutter {
            width: 45px;
            background-color: var(--bg-gutter);
            color: #606060;
            text-align: right;
            padding: 10px 8px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.5;
            user-select: none;
            overflow: hidden;
            border-right: 1px solid var(--border-color);
            flex-shrink: 0;
            white-space: pre;
        }

        textarea#sourceInput {
            flex: 1;
            background-color: transparent;
            color: #d4d4d4;
            border: none;
            resize: none;
            padding: 10px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre;
            overflow: auto;
            tab-size: 4;
        }

        /* --- Output Area --- */
        .preview-wrapper {
            flex: 1;
            position: relative;
            background-color: var(--bg-app);
            overflow: auto;
        }

        #codeBlock {
            margin: 0;
            padding: 10px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre;
            color: #d4d4d4;
            min-height: 100%;
        }

        /* --- Interactive Tokens --- */
        .token {
            display: inline;
            cursor: default;
            border-radius: 2px;
            transition: background-color 0.1s;
        }

        .token:hover {
            background-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        /* --- Footer --- */
        footer {
            height: 22px;
            background-color: var(--bg-status);
            color: white;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 11px;
            justify-content: flex-end;
            transition: background-color 0.3s;
        }

        footer.error {
            background-color: var(--bg-status-error);
        }

        footer.success {
            background-color: var(--bg-status-success);
        }

        /* --- Tooltip --- */
        #ast-tooltip {
            position: absolute;
            background: #252526;
            border: 1px solid #454545;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 4px;
            max-width: 320px;
            z-index: 1000;
            display: none;
            font-size: 12px;
            pointer-events: none;
        }

        #ast-tooltip h4 {
            margin: 0 0 8px 0;
            color: #fff;
            font-size: 13px;
            border-bottom: 1px solid #454545;
            padding-bottom: 4px;
        }

        #ast-tooltip pre {
            margin: 0;
            background: #1e1e1e;
            padding: 6px;
            border-radius: 3px;
            overflow-x: auto;
            color: #9cdcfe;
            font-family: 'Fira Code', monospace;
            font-size: 11px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scrollbar-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        @media (max-width: 768px) {
            main {
                flex-direction: column;
            }

            .panel {
                height: 50%;
            }

            .panel:first-child {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
        }
    </style>

    <script src="ast.js"></script>
</head>

<body>

    <header>
        <div class="brand">
            <svg viewBox="0 0 24 24">
                <path
                    d="M14.6,16.6L19.2,12L14.6,7.4L16,6L22,12L16,18L14.6,16.6M9.4,16.6L4.8,12L9.4,7.4L8,6L2,12L8,18L9.4,16.6Z" />
            </svg>
            AST Studio
        </div>
        <div class="actions">
            <button onclick="document.getElementById('sourceInput').value = ''; highlightCode();">Clear</button>
            <button onclick="highlightCode()">Force Parse</button>
        </div>
    </header>

    <main>
        <div class="panel">
            <div class="panel-header">Source Code</div>
            <div class="editor-wrapper">
                <div id="lineNumbers" class="gutter">1</div>
                <textarea id="sourceInput" spellcheck="false" placeholder="Paste your code here..."></textarea>
            </div>
        </div>
        <div class="panel">
            <div class="panel-header">Highlighted AST</div>
            <div class="preview-wrapper" id="previewContainer">
                <div id="codeBlock"></div>
            </div>
        </div>
    </main>

    <footer id="statusBar">Ready</footer>

    <!-- Tooltip -->
    <div id="ast-tooltip">
        <h4 id="tt-type">Type</h4>
        <pre id="tt-content">...</pre>
    </div>

    <script>
        /**
         * ========================================================================
         * COLOR CONFIGURATION
         * ========================================================================
         */
        const COLORS = {
            // Types
            GEN_OP: '#8E98A8', PUNCTUATION: '#A9B0BC', BRACES: '#BFC4CC',
            NAME: '#D8D8D8', NAME_TABLE: '#9CA5B2', NAME_TYPE: '#36A57E',
            NAME_LABEL: '#72CC82', NAME_LIFETIME: '#6a8c72', BUILITIN_VAR: '#6582C1',

            // Literals
            NUMBER: '#539BBD', NUMBER_KIND: '#6B73A1', STRING: '#7AA737', STRING_OUT: '#ACD163',

            // Control Flow
            COND_STAT: '#BD71C4', END_STAT: '#CE4C4C', FN_STAT: '#CE4C4C', VAR_STAT: '#D87D7D',
            ASSIGN: '#E5506F',

            // Comments / Misc
            COMMENT_WIP: '#CCFF00', WHITESPACE: '#575763', COMMENT_OUTER: '#3D3D44',
            COMMENT_DOC: '#378731', COMMENT_DOC_OUTER: '#196022',

            // Keywords / Annotations
            AS: '#D8B770', CON_STAT: '#D8B770', PAT_RESTRICT: '#BFC4CC', DROP_STAT: '#666CCC',
            EX_TINT: '#22275B', COMP_TINT: '#C6C611', ANNOTATION: '#A8A820',

            // Modifiers
            REF_CONST: '#8AB6CE', REF: '#8AB6CE', REF_SHARE: '#E4C4FF', REF_MUT: '#FF9647', MUT: '#FF9647',

            // Operators
            RANGE: '#498CFF', TRY: '#68997E', DYN: '#BF87FF', IMPL: '#CE905A', AND: '#5787DB', OR: '#B58055',

            // Specific Requested
            LIFETIME_SEP: '#47644e'
        };

        const KEYWORD_MAP = {
            'if': COLORS.COND_STAT, 'else': COLORS.COND_STAT, 'while': COLORS.COND_STAT,
            'for': COLORS.COND_STAT, 'loop': COLORS.COND_STAT, 'match': COLORS.COND_STAT,
            'return': COLORS.END_STAT, 'break': COLORS.END_STAT, 'continue': COLORS.END_STAT,
            'fn': COLORS.FN_STAT, 'struct': COLORS.CON_STAT, 'enum': COLORS.CON_STAT,
            'let': COLORS.VAR_STAT, 'const': COLORS.VAR_STAT, 'mut': COLORS.MUT,
            'unsafe': COLORS.FN_STAT, 'self': COLORS.BUILITIN_VAR, 'crate': COLORS.NAME,
            '@': COLORS.ANNOTATION, 'dyn': COLORS.DYN, 'as': COLORS.AS,
            '..': COLORS.RANGE, '=': COLORS.ASSIGN, '->': COLORS.PUNCTUATION, '=>': COLORS.ASSIGN,
            ':': COLORS.PUNCTUATION, '::': COLORS.PUNCTUATION, ';': COLORS.PUNCTUATION,
            ',': COLORS.PUNCTUATION, '.': COLORS.PUNCTUATION, '?': COLORS.TRY,
            '{': COLORS.BRACES, '}': COLORS.BRACES, '(': COLORS.BRACES, ')': COLORS.BRACES,
            '[': COLORS.BRACES, ']': COLORS.BRACES
        };

        /**
         * ========================================================================
         * UTILS: COLOR BLENDING
         * ========================================================================
         */
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        function blendColors(c1, c2, percent) {
            const rgb1 = hexToRgb(c1);
            const rgb2 = hexToRgb(c2);
            if (!rgb1 || !rgb2) return c1;

            const r = Math.round(rgb1.r + (rgb2.r - rgb1.r) * percent);
            const g = Math.round(rgb1.g + (rgb2.g - rgb1.g) * percent);
            const b = Math.round(rgb1.b + (rgb2.b - rgb1.b) * percent);

            return rgbToHex(r, g, b);
        }

        /**
         * ========================================================================
         * HIGHLIGHTER VISITOR
         * ========================================================================
         */
        class HighlighterVisitor extends Visitor {
            constructor() {
                super();
                this.fragment = document.createDocumentFragment();
                this.parentStack = [];
                this.currentRefColor = null; // Context for & * and address space
            }

            visit(node) {
                if (!node) return null;
                this.parentStack.push(node);
                const result = super.visit(node);
                this.parentStack.pop();
                return result;
            }

            getParent() {
                return this.parentStack.length > 1 ? this.parentStack[this.parentStack.length - 2] : null;
            }

            escape(text) {
                if (!text) return "";
                return text.replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            emit(color, text, astNode) {
                if (!text) return;
                const span = document.createElement('span');
                span.innerHTML = this.escape(text);
                span.className = 'token';
                span.style.color = color;
                span.astNode = astNode;
                this.fragment.appendChild(span);
            }

            // --- PreSpace Processing ---

            processPreSpace(text, node) {
                if (!text) return;

                const longBracketRegex = /(\[=*\[)([\s\S]*?)(\]=*\])/g;
                let lastIndex = 0;
                let match;
                let remaining = text;

                while ((match = longBracketRegex.exec(text)) !== null) {
                    const pre = text.substring(lastIndex, match.index);
                    this.processLineComments(pre, node);

                    this.emit(COLORS.COMMENT_OUTER, match[1], node);
                    this.emit(COLORS.WHITESPACE, match[2], node);
                    this.emit(COLORS.COMMENT_OUTER, match[3], node);

                    lastIndex = match.index + match[0].length;
                }

                if (lastIndex < text.length) {
                    this.processLineComments(text.substring(lastIndex), node);
                }
            }

            processLineComments(text, node) {
                if (!text) return;

                const lines = text.split(/\r?\n/);

                lines.forEach((line, index) => {
                    const dashIndex = line.indexOf('--');

                    if (dashIndex !== -1) {
                        const pre = line.substring(0, dashIndex);
                        const marker = line.substring(dashIndex, dashIndex + 2);
                        const content = line.substring(dashIndex + 2);

                        this.emit(COLORS.WHITESPACE, pre, node);
                        this.emit(COLORS.COMMENT_OUTER, marker, node);
                        const color = content.toUpperCase().includes('TODO') ? COLORS.COMMENT_WIP : COLORS.WHITESPACE;
                        this.emit(color, content, node);
                    } else {
                        this.emit(COLORS.WHITESPACE, line, node);
                    }

                    if (index < lines.length - 1) {
                        this.emit(COLORS.WHITESPACE, '\n', node);
                    }
                });
            }

            // --- Overrides ---

            visitToken(node) {
                const parent = this.getParent();

                this.processPreSpace(node.preSpace, node);

                if (node.txt) {
                    // 'ex' is handled by visitExport and visitExPreOp
                    if (node.txt === 'ex' && (parent.type === 'Export' || parent.type === 'ExPreOp')) {
                        return node;
                    }

                    let color = COLORS.NAME;
                    const txt = node.txt;

                    if (parent && (['LoopStat', 'WhileStat', 'ForStat', 'BlockStat', 'BreakStat', 'ContinueStat'].includes(parent.type))) {
                        if (txt === "'" || txt === ":") color = COLORS.NAME_LABEL;
                    }
                    if (parent && parent.type === 'VarDestrPat' && txt === '=') {
                        color = COLORS.PAT_RESTRICT;
                    }

                    if (color === COLORS.NAME && KEYWORD_MAP.hasOwnProperty(txt)) {
                        color = KEYWORD_MAP[txt];
                    }
                    else if (color === COLORS.NAME) {
                        if (/^[0-9]/.test(txt)) color = COLORS.NUMBER;
                        else if (/^[&*]/.test(txt) && color === COLORS.NAME) color = COLORS.REF;
                    }

                    this.emit(color, txt, node);
                }
                return node;
            }

            visitName(node) {
                this.processPreSpace(node.preSpace, node);
                const parent = this.getParent();
                let color = COLORS.NAME;
                const name = node.name;

                if (parent && parent.type === 'NamedField') color = COLORS.NAME_TABLE;
                else if (parent && parent.type === 'LifetimeSegment') color = COLORS.NAME_LIFETIME;
                else if (parent && ['LoopStat', 'WhileStat', 'ForStat', 'BlockStat', 'BreakStat', 'ContinueStat'].includes(parent.type)) {
                    color = COLORS.NAME_LABEL;
                }
                else if (parent && parent.type === 'OptAddrSpace' && this.currentRefColor) {
                    color = this.currentRefColor;
                }

                this.emit(color, name, node);
                return node;
            }

            // --- 'ex' Tinting Logic (With present check) ---

            visitExport(node) {
                // node.kw is OptToken
                if (node.kw && node.kw.present) {
                    this.processPreSpace(node.kw.preSpace, node);
                    const parent = this.getParent();
                    let targetColor = COLORS.FN_STAT;
                    if (parent) {
                        if (parent.type === 'FunctionDecl') targetColor = COLORS.FN_STAT;
                        else if (parent.type === 'StructDecl') targetColor = COLORS.CON_STAT;
                        else if (parent.type === 'EnumDecl') targetColor = COLORS.CON_STAT;
                        else if (parent.type === 'UnionDecl') targetColor = COLORS.CON_STAT;
                        else if (parent.type === 'TraitDecl') targetColor = COLORS.IMPL;
                        else if (parent.type === 'ImplDecl') targetColor = COLORS.IMPL;
                    }
                    const finalColor = blendColors(targetColor, COLORS.EX_TINT, 0.4);
                    this.emit(finalColor, node.kw.txt, node.kw);
                }
                return node;
            }

            visitSafety(node) {
                this.processPreSpace(node.preSpace, node);
                if (node.kind != 'default') {
                    this.emit(COLORS.FN_STAT, node.kind, node);
                }
                return node;
            }

            visitExPreOp(node) {
                this.processPreSpace(node.kw.preSpace, node);
                const finalColor = blendColors(COLORS.FN_STAT, COLORS.EX_TINT, 0.4);
                this.emit(finalColor, node.kw.txt, node.kw);
                return node;
            }

            // --- Reference Logic (RefAttrs, PreSpace, Colors) ---

            getRefColor(node) {
                if (!node) return COLORS.REF;
                if (node.type === 'MutRefType') return COLORS.REF_MUT;
                if (node.type === 'ShareRefType') return COLORS.REF_SHARE;
                if (node.type === 'ConstRefType') return COLORS.REF_CONST;
                return COLORS.REF;
            }

            // Explicit traversal of RefAttrs to ensure order and correctness
            visitRefAttrs(node) {
                this.visit(node.addrspace);
                this.visit(node.lifetime);
                this.visit(node.refType);
                return node;
            }

            visitRefPreOp(node) {
                const color = this.getRefColor(node.attrs.refType);

                this.processPreSpace(node.amp.preSpace, node.amp);

                this.emit(color, node.amp.txt, node.amp);

                const oldColor = this.currentRefColor;
                this.currentRefColor = color;

                this.visit(node.attrs);

                this.currentRefColor = oldColor;
                return node;
            }

            visitRefTypePreOp(node) {
                const color = this.getRefColor(node.attrs.refType);
                //TODO: prespace doesnt show here either
                this.processPreSpace(node.star.preSpace, node.star);

                this.emit(color, node.star.txt, node.star);

                const oldColor = this.currentRefColor;
                this.currentRefColor = color;

                this.visit(node.attrs);

                this.currentRefColor = oldColor;
                return node;
            }

            visitOptAddrSpace(node) {
                // node.kw is OptToken
                if (node.kw.present) {
                    this.processPreSpace(node.kw.preSpace, node);

                    const color = this.currentRefColor || COLORS.REF;
                    this.emit(color, node.kw.txt, node.kw);
                    this.visit(node.space);
                }
                return node;
            }

            visitMutRefType(node) {
                this.processPreSpace(node.kw.preSpace, node);
                const color = this.currentRefColor || COLORS.REF_MUT;
                this.emit(color, node.kw.txt, node.kw);
                return node;
            }
            visitShareRefType(node) {
                this.processPreSpace(node.kw.preSpace, node);
                const color = this.currentRefColor || COLORS.REF_SHARE;
                this.emit(color, node.kw.txt, node.kw);
                return node;
            }
            visitConstRefType(node) {
                this.processPreSpace(node.kw.preSpace, node);
                const color = this.currentRefColor || COLORS.REF_CONST;
                this.emit(color, node.kw.txt, node.kw);
                return node;
            }

            visitLifetimeSegment(node) {
                this.processPreSpace(node.kw.preSpace, node);
                this.emit(COLORS.LIFETIME_SEP, node.kw.txt, node.kw);
                this.visit(node.var);
                return node;
            }

            // --- Literals ---

            visitNum(node) {
                this.processPreSpace(node.preSpace, node);

                const s = node.num;

                if (s.startsWith('0x') || s.startsWith('0o') || s.startsWith('0b')) {
                    const prefix = s.substring(0, 2);
                    const rest = s.substring(2);

                    this.emit(COLORS.NUMBER_KIND, prefix, node);

                    const pIndex = rest.search(/[pP]/);
                    if (pIndex !== -1) {
                        this.emit(COLORS.NUMBER, rest.substring(0, pIndex), node);
                        this.emit(COLORS.NUMBER_KIND, rest.substring(pIndex), node);
                    } else {
                        this.emit(COLORS.NUMBER, rest, node);
                    }
                    return node;
                }

                const sciMatch = s.match(/^([-+]?\d*\.?\d+)([eE][-+]?\d+)$/);
                if (sciMatch) {
                    this.emit(COLORS.NUMBER, sciMatch[1], node);
                    this.emit(COLORS.NUMBER_KIND, sciMatch[2], node);
                    return node;
                }

                this.emit(COLORS.NUMBER, s, node);
                return node;
            }

            visitStr(node) {
                this.processPreSpace(node.preSpace, node);

                const s = node.str;
                const match = s.match(/^((?:\[{0,}\[)|["'])([\s\S]*?)((?:\]{0,}\])|["'])$/);

                if (match) {
                    const [_, open, content, close] = match;
                    this.emit(COLORS.STRING_OUT, open, node);

                    if (open === '"' || open === "'") {
                        const parts = content.split(/(\\.)/);
                        parts.forEach(part => {
                            if (part.startsWith('\\')) {
                                this.emit(COLORS.STRING_OUT, part, node);
                            } else {
                                this.emit(COLORS.STRING, part, node);
                            }
                        });
                    } else {
                        this.emit(COLORS.STRING, content, node);
                    }

                    this.emit(COLORS.STRING_OUT, close, node);
                } else {
                    this.emit(COLORS.STRING, s, node);
                }
                return node;
            }

            visitDocLineAnnotation(node) {
                this.processPreSpace(node.preSpace, node);
                const txt = node.txt + node.content;
                const color = txt.toUpperCase().includes('TODO') ? COLORS.COMMENT_WIP : COLORS.COMMENT_DOC;
                this.emit(color, txt, node);
                return node;
            }

            visitOuterDocLineAnnotation(node) {
                this.processPreSpace(node.preSpace, node);
                const txt = node.txt + node.content;
                const color = txt.toUpperCase().includes('TODO') ? COLORS.COMMENT_WIP : COLORS.COMMENT_DOC_OUTER;
                this.emit(color, txt, node);
                return node;
            }

            visitOptToken(node) {
                if (node.present && node.txt) {
                    this.processPreSpace(node.preSpace, node);

                    let color = COLORS.NAME;
                    const parent = this.getParent();

                    if (parent && parent.type === 'VarDestrPat' && node.txt === '=') {
                        color = COLORS.PAT_RESTRICT;
                    }

                    if (KEYWORD_MAP.hasOwnProperty(node.txt)) color = KEYWORD_MAP[node.txt];
                    else if (/^[0-9]/.test(node.txt)) color = COLORS.NUMBER;
                    else if (/^[&*]/.test(node.txt)) color = COLORS.REF;

                    this.emit(color, node.txt, node);
                }
                return node;
            }
        }

        /**
         * ========================================================================
         * APP LOGIC
         * ========================================================================
         */
        const inputArea = document.getElementById('sourceInput');
        const lineNumbers = document.getElementById('lineNumbers');
        const outputBlock = document.getElementById('codeBlock');
        const statusEl = document.getElementById('statusBar');
        const previewContainer = document.getElementById('previewContainer');

        const tooltip = document.getElementById('ast-tooltip');
        const ttType = document.getElementById('tt-type');
        const ttContent = document.getElementById('tt-content');

        const DEMO_CODE = `

    -- Calculate fibonacci

]]

    }

    }

        -- Do something unsafe

        inputArea.value = DEMO_CODE.trim();

        async function highlightCode() {
            const code = inputArea.value;
            outputBlock.innerHTML = '';
            statusEl.textContent = "Parsing...";
            statusEl.className = "";
            statusEl.style.backgroundColor = "var(--bg-status)";

            try {
                const parser = new Parser(code);
                const ast = parser.parseChunk();

                statusEl.textContent = "Parsed successfully";
                statusEl.className = "success";
                statusEl.style.backgroundColor = "var(--bg-status-success)";

                const visitor = new HighlighterVisitor();
                visitor.visit(ast);

                outputBlock.appendChild(visitor.fragment);

            } catch (e) {
                console.error(e);
                statusEl.textContent = "Error: " + e.message;
                statusEl.className = "error";
                statusEl.style.backgroundColor = "var(--bg-status-error)";
                const errSpan = document.createElement('span');
                errSpan.style.color = 'var(--bg-status-error)';
                errSpan.textContent = e.message;
                outputBlock.appendChild(errSpan);
            }
        }

        function updateLineNumbers() {
            const lines = inputArea.value.split('\n').length;
            lineNumbers.innerHTML = Array(lines).fill(0).map((_, i) => i + 1).join('\n');
        }

        function syncScroll() {
            lineNumbers.scrollTop = inputArea.scrollTop;
        }

        outputBlock.addEventListener('mouseover', (e) => {
            if (e.target.classList.contains('token')) {
                const node = e.target.astNode;
                if (node) {
                    let details = {};
                    for (let key in node) {
                        if (node.hasOwnProperty(key) && key !== 'type' && key !== 'preSpace') {
                            const val = node[key];
                            if (typeof val !== 'object' && typeof val !== 'function') {
                                details[key] = val;
                            }
                        }
                    }
                    ttType.textContent = node.type;
                    ttContent.textContent = JSON.stringify(details, null, 2);
                    tooltip.style.display = 'block';
                }
            }
        });

        outputBlock.addEventListener('mousemove', (e) => {
            const x = e.clientX + 15;
            const y = e.clientY + 15;
            if (x + 320 > window.innerWidth) {
                tooltip.style.left = (e.clientX - 325) + 'px';
            } else {
                tooltip.style.left = x + 'px';
            }
            tooltip.style.top = y + 'px';
        });

        outputBlock.addEventListener('mouseout', (e) => {
            if (e.target.classList.contains('token')) {
                tooltip.style.display = 'none';
            }
        });

        let debounceTimer;
        function debounce(func, wait) {
            return function () {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => func.apply(this, arguments), wait);
            };
        }

        inputArea.addEventListener('input', () => {
            updateLineNumbers();
            debounce(highlightCode, 500)();
        });

        inputArea.addEventListener('scroll', syncScroll);

        window.addEventListener('DOMContentLoaded', () => {
            updateLineNumbers();
            highlightCode();
        });

    </script>
